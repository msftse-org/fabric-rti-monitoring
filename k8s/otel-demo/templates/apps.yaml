{{- $codeChecksum := printf "%s%s" (.Files.Get "files/shop.py") (.Files.Get "files/requirements.txt") | sha256sum }}
{{- range $role, $downstream := dict "gateway" "checkout" "checkout" "inventory" "inventory" "payment" "payment" "shipping" "shipping" "notifications" "notifications" "" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $role }}
  labels:
    {{- include "otel-demo.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $role }}
spec:
  selector:
    app.kubernetes.io/name: {{ $role }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $role }}
  labels:
    {{- include "otel-demo.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $role }}
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $role }}
  template:
    metadata:
      labels:
        {{- include "otel-demo.labels" $ | nindent 8 }}
        app.kubernetes.io/name: {{ $role }}
        app.kubernetes.io/component: app
      annotations:
        checksum/code: {{ $codeChecksum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "otel-demo.podSecurity" $ | nindent 8 }}
      initContainers:
        # Installs only the hash-locked wheels from requirements.txt into an emptyDir.
        - name: install-dependencies
          image: {{ $.Values.images.python }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          command:
            - python
            - -m
            - pip
            - install
            - --no-cache-dir
            - --disable-pip-version-check
            - --require-hashes
            - "--only-binary=:all:"
            - --target=/deps
            - --requirement=/app/requirements.txt
          env:
            {{- include "otel-demo.pythonEnv" $ | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            {{- include "otel-demo.containerSecurity" $ | nindent 12 }}
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: deps
              mountPath: /deps
            - name: tmp
              mountPath: /tmp
      containers:
        - name: app
          image: {{ $.Values.images.python }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          command: ["python", "/app/shop.py"]
          env:
            {{- include "otel-demo.pythonEnv" $ | nindent 12 }}
            - name: PYTHONPATH
              value: /deps
            - name: SERVICE_ROLE
              value: {{ $role }}
            {{- if $downstream }}
            - name: DOWNSTREAM_URL
              value: http://{{ $downstream }}:8080
            {{- end }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: delta
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: {{ $.Values.apps.metricExportIntervalMs | quote }}
            - name: SERVICE_VERSION
              value: {{ $.Values.apps.version | quote }}
            - name: FAILURE_MULTIPLIER
              value: {{ $.Values.apps.failureMultiplier | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),k8s.deployment.name={{ $role }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 192Mi
          securityContext:
            {{- include "otel-demo.containerSecurity" $ | nindent 12 }}
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: deps
              mountPath: /deps
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: code
          configMap:
            name: shop-code
        - name: deps
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
