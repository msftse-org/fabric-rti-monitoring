# AKS variant of collector/cloud.yaml. Only three things differ:
#   1. Authentication uses Entra workload identity (use_azure_auth) instead of
#      the Container Apps managed identity endpoint.
#   2. resource/k8s stamps every record with the cluster name.
#   3. transform/demo also keeps the Kubernetes keys apps set via the downward API.
#   4. The export queue is on disk (file_storage), so a collector restart does not
#      drop telemetry that was accepted but not yet ingested.
# The filter/synthetic selector must stay identical to cloud.yaml.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # The chart mounts a PersistentVolumeClaim here (or an emptyDir when
  # collector.persistentQueue.enabled=false). Accept to disk first, export after.
  file_storage/queue:
    directory: /var/lib/otelcol/queue
    # Wait for the previous pod to release the queue's file lock during a
    # rollout or reschedule (its grace period is 30s) instead of crash-looping.
    timeout: 45s
    fsync: false
    compaction:
      on_start: true
      directory: /var/lib/otelcol/queue

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  # A demo selector, not an authentication or data-loss-prevention boundary.
  filter/synthetic:
    error_mode: propagate
    traces:
      span:
        - 'resource.attributes["demo.synthetic"] != true'
        - 'name != "demo.request" and name != "demo.checkout" and name != "demo.inventory" and name != "demo.payment" and name != "demo.shipping" and name != "demo.notifications" and name != "demo.postgres.query" and name != "demo.assistant" and not IsMatch(name, "^(invoke_agent|chat|execute_tool) [A-Za-z0-9._-]{1,64}$")'
      spanevent:
        - 'name != "exception"'
    logs:
      log_record:
        - 'resource.attributes["demo.synthetic"] != true'
    metrics:
      metric:
        - 'resource.attributes["demo.synthetic"] != true'
        - 'name != "demo.request.duration" and name != "demo.requests"'
  resource/k8s:
    attributes:
      - key: k8s.cluster.name
        value: ${env:K8S_CLUSTER_NAME}
        action: upsert
  # Keep a small teaching contract. Review a workload-specific privacy policy
  # before adding real producers. Attribute VALUES are not automatically safe.
  transform/demo:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - keep_keys(resource.attributes, ["service.name", "service.version", "deployment.environment.name", "demo.synthetic", "k8s.cluster.name", "k8s.namespace.name", "k8s.deployment.name", "k8s.pod.name", "k8s.node.name"])
          # GenAI semantic-convention metadata only: never prompts, completions, or tool arguments.
          - keep_keys(attributes, ["demo.scenario", "outcome", "demo.run_id", "gen_ai.operation.name", "gen_ai.provider.name", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens", "gen_ai.response.finish_reasons", "gen_ai.agent.name", "gen_ai.tool.name", "gen_ai.tool.type"])
          - set(status.message, "")
      # Exception events are the one span event kept, for issue grouping. Only the
      # type and message survive, and variable values in the message are replaced
      # before export: IDs, addresses, and numbers can identify people or orders.
      - context: spanevent
        statements:
          - keep_keys(attributes, ["exception.type", "exception.message"])
          - replace_pattern(attributes["exception.message"], "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", "<uuid>")
          - replace_pattern(attributes["exception.message"], "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}", "<email>")
          - replace_pattern(attributes["exception.message"], "[0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}", "<ip>")
          - replace_pattern(attributes["exception.message"], "[0-9a-fA-F]{16,}", "<hex>")
          - replace_pattern(attributes["exception.message"], "[0-9]+", "<n>")
          - truncate_all(attributes, 256)
    log_statements:
      - context: log
        statements:
          - keep_keys(resource.attributes, ["service.name", "service.version", "deployment.environment.name", "demo.synthetic", "k8s.cluster.name", "k8s.namespace.name", "k8s.deployment.name", "k8s.pod.name", "k8s.node.name"])
          - keep_keys(attributes, ["demo.scenario", "outcome", "demo.run_id"])
          - set(body, "Synthetic request completed")
    metric_statements:
      - context: datapoint
        statements:
          - keep_keys(resource.attributes, ["service.name", "service.version", "deployment.environment.name", "demo.synthetic", "k8s.cluster.name", "k8s.namespace.name", "k8s.deployment.name", "k8s.pod.name", "k8s.node.name"])
          - keep_keys(attributes, ["demo.scenario", "outcome"])
  # Continuous traffic: each Fabric ingestion call has a fixed cost, so send
  # fewer, larger batches. One-second batches overflowed the logs queue.
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  # This is the database QUERY URI. The SDK discovers ingestion endpoints.
  azuredataexplorer:
    cluster_uri: ${env:KUSTO_CLUSTER_URI}
    db_name: ${env:KUSTO_DATABASE}
    # Workload identity: the AKS webhook injects AZURE_CLIENT_ID, AZURE_TENANT_ID,
    # and a projected token for the annotated service account. No secret.
    use_azure_auth: true
    logs_table_name: OTELLogs
    traces_table_name: OTELTraces
    metrics_table_name: OTELMetrics
    ingestion_type: managed
    timeout: 30s
    sending_queue:
      enabled: true
      num_consumers: 4
      # Batches, persisted by file_storage/queue until the exporter succeeds.
      queue_size: 1000
      storage: file_storage/queue
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 15s
      max_elapsed_time: 2m

service:
  extensions: [health_check, file_storage/queue]
  telemetry:
    logs:
      level: info
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/synthetic, resource/k8s, transform/demo, batch]
      exporters: [azuredataexplorer]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/synthetic, resource/k8s, transform/demo, batch]
      exporters: [azuredataexplorer]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/synthetic, resource/k8s, transform/demo, batch]
      exporters: [azuredataexplorer]
